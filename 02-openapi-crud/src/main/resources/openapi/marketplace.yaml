openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: |
    Контракт маркетплейса: каталог, заказы, промокоды и доступ по ролям.

    Роли в claim `role` access-токена: `USER`, `SELLER`, `ADMIN`.
    Все методы, кроме `/auth/*` и `/health`, требуют заголовок `Authorization: Bearer`.

servers:
  - url: /

tags:
  - name: Auth
    description: Регистрация и выдача токенов. Без access-токена.
  - name: Products
    description: |
      Каталог. Чтение доступно всем авторизованным ролям.
      Создание, изменение и архивация: SELLER только свои товары (`seller_id`), ADMIN любые, USER запрещено (`ACCESS_DENIED`).
  - name: Orders
    description: |
      Заказы. USER работает только со своими, ADMIN с любыми, SELLER запрещено (`ACCESS_DENIED`).
      Чужой заказ для USER — `ORDER_OWNERSHIP_VIOLATION`.
  - name: PromoCodes
    description: Промокоды. Создание доступно SELLER и ADMIN. USER — `ACCESS_DENIED`.

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Аутентификация
      description: Неверная пара email/пароль возвращает `TOKEN_INVALID`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/TokenInvalid'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Обновление access-токена по refresh-токену
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/RefreshTokenInvalid'

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Список товаров
      description: Пагинация с нуля. Фильтры `status` и `category` необязательны, категория сравнивается точно.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CategoryFilter'
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Создание товара
      description: SELLER и ADMIN. `seller_id` берётся из токена, в теле его нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Товар по идентификатору
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PRODUCT_NOT_FOUND
                message: Product not found
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Полное обновление товара
      description: SELLER только если `seller_id` совпадает с пользователем токена. ADMIN любой товар.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PRODUCT_NOT_FOUND
                message: Product not found
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Мягкое удаление
      description: Запись остаётся, `status` становится `ARCHIVED`. SELLER только свои товары, ADMIN любые.
      responses:
        '200':
          description: Товар архивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PRODUCT_NOT_FOUND
                message: Product not found

  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Создание заказа
      description: |
        USER и ADMIN. Проверки по порядку: частота `CREATE_ORDER`, нет заказа в `CREATED` или `PAYMENT_PENDING`,
        товары существуют и `ACTIVE`, хватает остатка, резерв остатка и снимок цены в одной транзакции,
        затем промокод и запись `user_operations`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан в статусе CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PRODUCT_NOT_FOUND
                message: Product not found
        '409':
          description: Неактивный товар, уже есть активный заказ или не хватает остатка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                inactive:
                  value:
                    error_code: PRODUCT_INACTIVE
                    message: Product is not active
                activeOrder:
                  value:
                    error_code: ORDER_HAS_ACTIVE
                    message: User already has an active order
                stock:
                  value:
                    error_code: INSUFFICIENT_STOCK
                    message: Insufficient stock
                    details:
                      items:
                        - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                          requested: 5
                          available: 1
        '422':
          description: Промокод не применим
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    error_code: PROMO_CODE_INVALID
                    message: Promo code is not valid
                minAmount:
                  value:
                    error_code: PROMO_CODE_MIN_AMOUNT
                    message: Order total is below the promo code minimum
        '429':
          $ref: '#/components/responses/OrderLimitExceeded'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Заказ по идентификатору
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав или заказ принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                role:
                  value:
                    error_code: ACCESS_DENIED
                    message: Access denied
                owner:
                  value:
                    error_code: ORDER_OWNERSHIP_VIOLATION
                    message: Order belongs to another user
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: ORDER_NOT_FOUND
                message: Order not found
    put:
      tags: [Orders]
      operationId: updateOrder
      summary: Замена позиций заказа
      description: |
        Только статус `CREATED`. Сначала возвращаются старые остатки, затем проверяются и резервируются новые позиции.
        Промокод пересчитывается. Если сумма стала ниже минимума, скидка снимается.
        Вся замена выполняется в одной транзакции. Пишется операция `UPDATE_ORDER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Заказ обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав или заказ принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                role:
                  value:
                    error_code: ACCESS_DENIED
                    message: Access denied
                owner:
                  value:
                    error_code: ORDER_OWNERSHIP_VIOLATION
                    message: Order belongs to another user
        '404':
          description: Заказ или товар не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order:
                  value:
                    error_code: ORDER_NOT_FOUND
                    message: Order not found
                product:
                  value:
                    error_code: PRODUCT_NOT_FOUND
                    message: Product not found
        '409':
          description: Недопустимое состояние, неактивный товар или нехватка остатка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                state:
                  value:
                    error_code: INVALID_STATE_TRANSITION
                    message: Order cannot be updated in the current status
                inactive:
                  value:
                    error_code: PRODUCT_INACTIVE
                    message: Product is not active
                stock:
                  value:
                    error_code: INSUFFICIENT_STOCK
                    message: Insufficient stock
        '422':
          description: Применённый промокод больше недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: PROMO_CODE_INVALID
                message: Promo code is not valid
        '429':
          $ref: '#/components/responses/OrderLimitExceeded'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Отмена заказа
      description: |
        Разрешено только из `CREATED` и `PAYMENT_PENDING`.
        Остатки возвращаются, использование промокода уменьшается, статус становится `CANCELED`.
        Одна транзакция.
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав или заказ принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                role:
                  value:
                    error_code: ACCESS_DENIED
                    message: Access denied
                owner:
                  value:
                    error_code: ORDER_OWNERSHIP_VIOLATION
                    message: Order belongs to another user
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: ORDER_NOT_FOUND
                message: Order not found
        '409':
          description: Отмена из этого статуса запрещена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_STATE_TRANSITION
                message: Order cannot be canceled in the current status

  /orders/{id}/transition:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: transitionOrder
      summary: Допустимый переход статуса
      description: |
        Цепочка `CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED`.
        Отмена этим методом не выполняется. Любой другой переход — `INVALID_STATE_TRANSITION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTransition'
      responses:
        '200':
          description: Статус изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав или заказ принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                role:
                  value:
                    error_code: ACCESS_DENIED
                    message: Access denied
                owner:
                  value:
                    error_code: ORDER_OWNERSHIP_VIOLATION
                    message: Order belongs to another user
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: ORDER_NOT_FOUND
                message: Order not found
        '409':
          description: Переход не входит в модель состояний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: INVALID_STATE_TRANSITION
                message: Status transition is not allowed

  /promo-codes:
    post:
      tags: [PromoCodes]
      operationId: createPromoCode
      summary: Создание промокода
      description: SELLER и ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: Промокод создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AccessDenied'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token. Claim `role` — роль пользователя.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ProductStatus'
    CategoryFilter:
      name: category
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100

  responses:
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: VALIDATION_ERROR
            message: Validation failed
            details:
              violations:
                - field: name
                  message: size must be between 1 and 255
    Unauthorized:
      description: Access token отсутствует, неверен или просрочен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                error_code: TOKEN_INVALID
                message: Access token is invalid
            expired:
              value:
                error_code: TOKEN_EXPIRED
                message: Access token is expired
    TokenInvalid:
      description: Токен или учётные данные не приняты
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: TOKEN_INVALID
            message: Invalid email or password
    RefreshTokenInvalid:
      description: Refresh token не принят
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: REFRESH_TOKEN_INVALID
            message: Refresh token is invalid
    AccessDenied:
      description: Роли недостаточно для операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: ACCESS_DENIED
            message: Access denied
    OrderLimitExceeded:
      description: Слишком частая операция с заказом
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error_code: ORDER_LIMIT_EXCEEDED
            message: Order operation rate limit exceeded

  schemas:
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          enum:
            - PRODUCT_NOT_FOUND
            - PRODUCT_INACTIVE
            - ORDER_NOT_FOUND
            - ORDER_LIMIT_EXCEEDED
            - ORDER_HAS_ACTIVE
            - INVALID_STATE_TRANSITION
            - INSUFFICIENT_STOCK
            - PROMO_CODE_INVALID
            - PROMO_CODE_MIN_AMOUNT
            - ORDER_OWNERSHIP_VIOLATION
            - VALIDATION_ERROR
            - ACCESS_DENIED
            - TOKEN_EXPIRED
            - TOKEN_INVALID
            - REFRESH_TOKEN_INVALID
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Дополнительные данные. Для валидации — `violations`, для остатка — `items`.

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]

    UserRole:
      type: string
      enum: [USER, SELLER, ADMIN]

    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72
        role:
          $ref: '#/components/schemas/UserRole'
          description: Если поле опущено, назначается USER. На защите роль передаётся явно.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 72

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    UserResponse:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Время жизни access-токена в секундах
        token_type:
          type: string
          example: Bearer

    ProductCreate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          description: Цена больше нуля. Нижняя граница 0.01.
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductUpdate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductResponse:
      type: object
      required: [id, name, price, stock, category, status, seller_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
        stock:
          type: integer
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPage:
      type: object
      required: [items, totalElements, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    OrderItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999

    OrderCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        promo_code:
          type: string
          nullable: true
          pattern: '^[A-Z0-9_]{4,20}$'

    OrderUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderTransition:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PAYMENT_PENDING, PAID, SHIPPED, COMPLETED]

    OrderItemResponse:
      type: object
      required: [product_id, quantity, price_at_order]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price_at_order:
          type: number
          format: decimal

    OrderResponse:
      type: object
      required: [id, user_id, status, total_amount, discount_amount, items, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code:
          type: string
          nullable: true
        total_amount:
          type: number
          format: decimal
        discount_amount:
          type: number
          format: decimal
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, min_order_amount, max_uses, valid_from, valid_until]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
          minimum: 0.01
        min_order_amount:
          type: number
          format: decimal
          minimum: 0
        max_uses:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true

    PromoCodeResponse:
      type: object
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, current_uses, valid_from, valid_until, active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
        min_order_amount:
          type: number
          format: decimal
        max_uses:
          type: integer
        current_uses:
          type: integer
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean

security:
  - bearerAuth: []
